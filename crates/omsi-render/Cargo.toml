[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# (DLSS: NVIDIA Streamline on wgpu's own D3D12 device and queue, see `dlss`)
windows = { workspace = true, features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D12", "Win32_Foundation", "Win32_System_LibraryLoader"] }
# (the `windows::core::implement` macro in `dlss` expands to code naming this crate, so it has to
# be a dependency here even though nothing imports it by that name)
windows-core = "0.62"
wgpu-hal = { workspace = true, features = ["dx12"] }

[dev-dependencies]
naga = { workspace = true, features = ["spv-out", "glsl-out", "hlsl-out"] }
env_logger.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
