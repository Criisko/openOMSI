[package]
name = "omsi-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wgpu renderer: textured, lit meshes with OMSI alpha modes; on-screen and off-screen targets"

[dependencies]
omsi-cfg = { path = "../omsi-cfg" }
omsi-geometry = { path = "../omsi-geometry" }
omsi-texture = { path = "../omsi-texture" }
wgpu.workspace = true
bytemuck.workspace = true
glam.workspace = true
pollster.workspace = true
rayon.workspace = true
hashbrown.workspace = true
log.workspace = true
anyhow.workspace = true
winit.workspace = true

[target.'cfg(windows)'.dependencies]
# (DLSS: NVIDIA Streamline on wgpu's own D3D12 device and queue, see `dlss`)
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D12", "Win32_Foundation", "Win32_System_LibraryLoader"] }
windows-core = "0.62"
wgpu-hal = { version = "29", features = ["dx12"] }

[dev-dependencies]
naga = { version = "29", features = ["spv-out", "glsl-out"] }
