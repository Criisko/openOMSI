# Windows release for this fork.
#
# It is the project's .github/workflows/release.yml cut down to what a fork can build, plus
# one extra step that carries the ReShade workaround:
#
#   * Windows x64 only. The Android job wants secrets.ANDROID_KEYSTORE_B64, which a fork does
#     not have, and the project's release job waits for every platform - so one missing
#     secret would mean no release at all.
#   * The archive keeps the same name the launcher's updater looks for
#     (openOMSI-<version>-windows-x64.zip), so the game updates itself from this fork.
#
# THE RESHADE WORKAROUND, and why it is here rather than in a commit:
#   wgpu makes IDXGIFactoryMedia through the legacy CreateDXGIFactory1. ReShade hooks that
#   legacy export, and the process then dies with an access violation inside dxgi.dll
#   (0xc0000005) before any window shows - the game never starts. openOMSI never makes a
#   composition swapchain, so that factory is not needed at all, and wgpu itself treats the
#   call as optional (it is wrapped in .ok() upstream). The step takes that one line out of
#   the wgpu-hal source before building.
#
#   Keeping it in the workflow (instead of vendoring wgpu-hal into the repository) means the
#   only thing to keep up with upstream is this file: the step reads the wgpu-hal version out
#   of Cargo.lock itself, and when the project patches that crate to its own wgpu fork - the
#   whole set of wgpu crates then comes from that one source, so a copy standing beside it
#   would be a second wgpu-hal, of the wrong kind for the fork's wgpu - it takes the line out
#   of the source cargo itself fetched. If that source ever stops containing the line, the
#   step fails and says so, and the step after the build checks that the line is still out,
#   so a stale or lost workaround cannot slip into a release unnoticed.

name: Windows release

# Nothing is published by itself while the 0.2.20 merge is being checked: this workflow runs
# only when it is started by hand (the Actions tab, "Run workflow"). Put the
# `push: branches: [main]` trigger back, above `workflow_dispatch`, once a build from this
# branch has been seen to work on a machine with a real graphics card.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      # MAJOR.MINOR from VERSION, COMMIT the commits since VERSION last changed
      # (scripts/version.sh, in PowerShell so that no shell is needed on the runner).
      - name: Version
        id: v
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          $last = (git log -1 --format=%H -- VERSION)
          $n = if ($last) { [int](git rev-list --count "$last..HEAD") } else { 0 }
          $version = "$base.$n"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "OPENOMSI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "openOMSI $version"

      - name: The ReShade workaround
        shell: pwsh
        run: |
          $lock = Get-Content Cargo.lock -Raw
          if ($lock -notmatch '(?ms)^name = "wgpu-hal"\r?\nversion = "([^"]+)"') {
            throw 'wgpu-hal is not in Cargo.lock'
          }
          $ver = $Matches[1]
          Write-Host "wgpu-hal $ver"

          # Where the crate comes from decides how the line comes out of it. The project
          # patches wgpu-hal to the org's own wgpu fork, and there the whole set of wgpu
          # crates comes from that one source, so that case takes the line out of the source
          # cargo fetched. Without such a patch the crate is the registry's, on its own, and
          # a vendored copy is the one built - which is what [patch.crates-io] below is for.
          $toml = Get-Content Cargo.toml -Raw
          $vendored = $false
          if ($toml -match '(?m)^wgpu-hal = \{ git = "([^"]+)", rev = "([^"]+)" \}') {
            Write-Host "the project's own wgpu-hal, from $($Matches[1]) at $($Matches[2])"
            $short = $Matches[2].Substring(0, 7)
            cargo fetch
            if ($LASTEXITCODE -ne 0) { throw 'cargo fetch failed' }
            $checkout = Get-ChildItem "$env:USERPROFILE\.cargo\git\checkouts" -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like '*wgpu-openomsi*' } |
              ForEach-Object { Join-Path $_.FullName $short } |
              Where-Object { Test-Path (Join-Path $_ 'wgpu-hal\Cargo.toml') } |
              Select-Object -First 1
            if (-not $checkout) { throw "the wgpu fork at $short is not in the cargo cache, even after cargo fetch" }
            $file = Join-Path $checkout 'wgpu-hal\src\dx12\instance.rs'
          }
          else {
            Invoke-WebRequest "https://static.crates.io/crates/wgpu-hal/wgpu-hal-$ver.crate" -OutFile wgpu-hal.crate
            tar -xzf wgpu-hal.crate
            New-Item -ItemType Directory -Force vendor | Out-Null
            Move-Item "wgpu-hal-$ver" vendor/wgpu-hal
            $file = 'vendor/wgpu-hal/src/dx12/instance.rs'
            $vendored = $true
          }

          $text = Get-Content $file -Raw
          $note = @(
            '        // IDXGIFactoryMedia is made through the legacy CreateDXGIFactory1. ReShade hooks',
            '        // that legacy export and the process dies with an access violation inside dxgi.dll,',
            '        // so it is not asked for here. It is optional to wgpu (upstream wraps the call in',
            '        // .ok()) and is only used for CreateSwapChainForCompositionSurfaceHandle, which',
            '        // openOMSI never makes.',
            '        let factory_media: Option<Dxgi::IDXGIFactoryMedia> = None;',
            '        let _ = &lib_dxgi;'
          ) -join "`n"
          $pattern = '(?m)^[ \t]*// Create IDXGIFactoryMedia\r?\n[ \t]*let factory_media = lib_dxgi\.create_factory_media\(\)\.ok\(\);'
          $patched = $text -replace $pattern, $note
          if ($patched -eq $text) {
            throw 'the line to patch is not in wgpu-hal any more - look at the workaround before releasing'
          }
          Set-Content $file $patched -NoNewline
          Write-Host "patched $file"

          if ($vendored) {
            # a vendored copy is built only if [patch.crates-io] says so, and the project keeps
            # a section of that name for itself (for gpu-allocator): a second table would be a
            # duplicate key, so the entry goes inside the one that is there
            $entry = 'wgpu-hal = { path = "vendor/wgpu-hal" }'
            if (-not $toml.Contains($entry)) {
              $reason = '# Lets ReShade load: see vendor/wgpu-hal/src/dx12/instance.rs'
              if ($toml -match '(?m)^\[patch\.crates-io\]\r?\n') {
                $toml = $toml -replace '(?m)^(\[patch\.crates-io\]\r?\n)', ('$1' + "$reason`n$entry`n")
              } else {
                $toml = $toml.TrimEnd() + "`n`n" + "$reason`n[patch.crates-io]`n$entry`n"
              }
              Set-Content Cargo.toml $toml -NoNewline
              Write-Host 'put the wgpu-hal patch entry into Cargo.toml'
            }
          }

          # the step after the build reads this back to check the workaround is still in the
          # source that was built
          "RESHADE_FILE=$file" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # No --locked here: the [patch.crates-io] entry above changes Cargo.lock, so the build
      # has to be allowed to record that (one entry, wgpu-hal's source).
      - name: Build
        shell: pwsh
        run: |
          cargo build --release --target $env:TARGET -p omsi-app -p omsi-launcher-core
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item "target/$env:TARGET/release/openomsi.exe", "target/$env:TARGET/release/openomsi-launcher.exe" dist/windows/
          # Steam's rich presence: the x64 program imports its library and does not start at
          # all without it beside the program ("steam_api64.dll was not found"), so the archive
          # has to carry it as well (the project's own scripts/build-windows.cmd copies the
          # same file, and this is the only thing it does that this build does not).
          Copy-Item "assets/steam_redist/steam_api64.dll" dist/windows/
          Get-ChildItem dist/windows

      # cargo unpacks a git checkout once and keeps it, but a build that put the line back
      # would mean a release without the fix: the workaround has to be in what was built.
      - name: The workaround survived the build
        shell: pwsh
        run: |
          $text = Get-Content $env:RESHADE_FILE -Raw
          if ($text -notmatch 'IDXGIFactoryMedia is made through the legacy') {
            throw 'the wgpu-hal workaround is not in the source that was built'
          }
          Write-Host 'the workaround is in the source that was built'

      # Microsoft's shader compiler for DirectX 12 (dxcompiler.dll, dxil.dll beside the
      # program): without it wgpu falls back to the old FXC, which is slow and refuses some
      # of the game's shaders. The archive has to carry it, because an update removes the
      # program files an earlier one installed that the new archive no longer has.
      - name: DirectX shader compiler
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R microsoft/DirectXShaderCompiler --pattern "dxc_*.zip" -D dxc
          $zip = Get-ChildItem dxc/*.zip | Where-Object { $_.Name -notmatch "linux|pdb" } | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath dxc/x
          Copy-Item "dxc/x/bin/x64/dxcompiler.dll", "dxc/x/bin/x64/dxil.dll" dist/windows/
          Get-ChildItem dist/windows

      # The Visual C++ runtime beside the program (Microsoft allows it to be shipped
      # app-locally): without it a PC lacking the Redistributable refuses to start the game.
      - name: Visual C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName | Select-Object -Last 1
          $dir = if ($crt) { $crt.FullName } else { "$env:SystemRoot\System32" }
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            Copy-Item (Join-Path $dir $dll) dist/windows/
          }
          Get-ChildItem dist/windows

      - name: Package
        shell: pwsh
        run: |
          $name = "openOMSI-$env:OPENOMSI_VERSION-windows-x64"
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item README.md, LICENSE dist/windows/
          Compress-Archive -Path dist/windows/* -DestinationPath "out/$name.zip"
          Get-ChildItem out

      # What this fork adds on top of the project is checked before anything is handed to
      # anyone: the DLSS change, which is the one thing left here that the project does not
      # have (the ReShade workaround is the other, applied to wgpu above where nothing can
      # lose it, and the head sway, the look smoothing and the cabin/outside key have gone
      # upstream and are the project's own code now). The build compiles happily with a
      # setting's key, or a launcher row, quietly gone - and the nightly merge
      # (.github/workflows/sync-upstream.yml) is where that could happen. A failure here
      # publishes nothing, exactly like a merge that conflicts, so a silent loss is a red run
      # and no update rather than a release without the feature.
      - name: What the fork adds is still whole
        shell: pwsh
        run: |
          if (-not (Test-Path crates/omsi-render/src/dlss.rs)) { throw 'dlss.rs is gone' }
          if (-not (Test-Path crates/omsi-render/src/pipelines/dlss.rs)) { throw 'the motion pipelines are gone' }
          $mentions = @{
            'dlss' = @(
              'crates/omsi-app/src/settings.rs',
              'crates/omsi-app/src/launcher/pages.rs',
              'crates/omsi-launcher-core/src/lib.rs'
            )
          }
          foreach ($needle in $mentions.Keys) {
            foreach ($file in $mentions[$needle]) {
              if (-not (Select-String -Path $file -Pattern $needle -Quiet)) {
                throw "$file does not mention $needle any more"
              }
            }
          }
          # The project's own contracts: every key both readers of settings.cfg must know,
          # every row of a launcher tab named in by_tab(), and every OMSI_* name the code
          # mentions declared in omsi_cfg::flags.
          cargo test --release --target $env:TARGET -p omsi-launcher-core --lib the_games_options_survive_a_save
          if ($LASTEXITCODE -ne 0) { throw 'the settings round trip failed' }
          cargo test --release --target $env:TARGET -p omsi-app --lib every_setting_is_on_exactly_one_tab
          if ($LASTEXITCODE -ne 0) { throw 'a launcher row is not named in by_tab()' }
          cargo test --release --target $env:TARGET -p omsi-cfg --lib flags
          if ($LASTEXITCODE -ne 0) { throw 'an OMSI_* name in the code is not declared in omsi_cfg::flags' }

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          version="$OPENOMSI_VERSION"
          tag="v$version"
          notes="**openOMSI $version** (this fork: the Windows build with the ReShade workaround)

          The project's own release notes for this commit are on
          https://github.com/openOMSI-Project/openOMSI/releases."
          # gh makes the tag itself, through the releases API. Pushing it with git instead
          # fails whenever this commit's workflow file differs from the one on main: GitHub
          # refuses to let a workflow token create or update a workflow file without the
          # "workflows" permission, which a GITHUB_TOKEN cannot have. Two commits built at
          # the same time are enough for that to happen.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" out/*.zip --clobber
            gh release edit "$tag" --title "openOMSI $version" --notes "$notes"
          else
            gh release create "$tag" out/*.zip --title "openOMSI $version" --notes "$notes" --target "$GITHUB_SHA"
          fi
